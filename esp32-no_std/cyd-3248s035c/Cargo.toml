[package]
name = "slint-workshop-esp-cyd-3248s035c"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
edition = "2024"
rust-version = "1.88"

[workspace]

[dependencies]
log = { version = "0.4", default-features = false }

slint = { version = "1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["log"] }
static_cell = "2.1.1"
heapless = { version = "0.8.0", default-features = false }
critical-section = "1.2.0"

embedded-graphics = "0.8.2"
embedded-hal-bus = "0.3.0"
mipidsi = "0.10.0"

esp-hal = { version = "~1.0", features = ["esp32", "log-04", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32", "log-04"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-backtrace = { version = "0.18.1", features = ["esp32", "println", "panic-handler"] }
esp-alloc = { version = "0.9.0", features = ["esp32"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32", "log-04"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[build-dependencies]
slint-build = "1"

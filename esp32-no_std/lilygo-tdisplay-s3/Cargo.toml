[package]
name = "slint-workshop-esp-lilygo-tdisplay-s3"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
edition = "2024"
rust-version = "1.88"

[workspace]

[dependencies]
log = { version = "0.4", default-features = false }

slint = { version = "1.12.1", default-features = false, features = [
    "compat-1-2",
    "unsafe-single-threaded",
    "libm",
    "renderer-software",
] }

embassy-executor = { version = "0.7.0", features = ["task-arena-size-40960"] }
embassy-time = "0.4.0"
embassy-sync = { version = "0.7.0", default-features = false }
static_cell = "2.1.0"

esp-hal-embassy = { version = "0.9.0", features = ["esp32s3"] }
esp-hal = { version = "=1.0.0-rc.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.15.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.17.0", features = [
    "esp32s3",
    "exception-handler",
    "println",
] }
esp-alloc = "0.8.0"
esp-rom-sys = "0.1.1"
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32s3"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[build-dependencies]
slint-build = { version = "1.12.1", features = ["sdf-fonts"] }
